# Railway deploy config for Nasim Air (Django + React SPA)
# Docs: https://docs.railway.app/reference/config-as-code

[build]
builder = "NIXPACKS"
buildCommand = "bash bin/railway-build.sh"

[deploy]
startCommand = "bash bin/railway-start.sh"
healthcheckPath = "/healthz/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
